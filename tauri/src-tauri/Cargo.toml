[package]
name = "squirrel-beating-game"
version = "1.0.0"
description = "Squirrel Beating Game — лесная аркада"
authors = ["SquirrelBeatingGame"]
edition = "2021"
rust-version = "1.77.2"

# Нативные сборки под мобилки требуют библиотечную цель (cdylib для Android/iOS)
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
