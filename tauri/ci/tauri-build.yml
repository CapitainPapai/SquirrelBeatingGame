name: Tauri build

# Собирает нативные приложения Squirrel Beating Game.
# Скопируй файл в .github/workflows/tauri-build.yml, чтобы он заработал.
#
# Триггеры: вручную (Actions → Run workflow) и теги вида v1.0.0
# (к тегу дополнительно прикрепляются артефакты релиза).
# Секреты не обязательны: без них соберутся неподписанные сборки.
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS — подпись APK
#   APPLE_* — подпись и notarization для macOS
# MacOS-раннеры считаются в лимит GitHub Actions с коэффициентом 10,
# поэтому собирай вручную, когда нужно, а не на каждый пуш.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundles: 'dmg,app'
          - platform: ubuntu-22.04
            args: ''
            bundles: 'deb,appimage'
          - platform: windows-latest
            args: ''
            bundles: 'msi,nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Prepare web
        run: node tauri/scripts/prepare-web.mjs

      - name: Build
        working-directory: tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@^2 build ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: squirrel-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/**/release/bundle/macos/*.app
            tauri/src-tauri/target/**/release/bundle/deb/*.deb
            tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/**/release/bundle/msi/*.msi
            tauri/src-tauri/target/**/release/bundle/nsis/*.exe

  android:
    name: Android (apk + aab)
    runs-on: ubuntu-22.04
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK / NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Prepare web
        run: node tauri/scripts/prepare-web.mjs

      - name: Init android project
        working-directory: tauri
        run: npx --yes @tauri-apps/cli@^2 android init --ci

      - name: Inject signing key (если заданы секреты)
        if: env.KEYSTORE_B64 != ''
        working-directory: tauri/src-tauri/gen/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > squirrel.keystore
          printf 'password=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "$GITHUB_WORKSPACE/tauri/src-tauri/gen/android/squirrel.keystore" \
            > keystore.properties

      - name: Build apk + aab
        working-directory: tauri
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          npx --yes @tauri-apps/cli@^2 android build --apk --aab

      - uses: actions/upload-artifact@v4
        with:
          name: squirrel-android
          if-no-files-found: error
          path: |
            tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            tauri/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
